name = "pr0social-booking"
main = "src/index.js"
compatibility_date = "2026-09-15"
workers_dev = false

# Where a booking enquiry lands. The mailbox itself is hosted on Zoho (free tier),
# Camilo's call 2026-09-15, because Cloudflare Email Routing forwards but cannot
# host an inbox Jerrell logs into.
# WARNING: this address must ALSO be a VERIFIED destination address on the
# Cloudflare account or send() throws a 502. Verifying is a click in the inbox.
# BOOKING_CC is a best-effort second copy to the inbox Jerrell actually lives in.
# Free Zoho cannot forward, POP or IMAP, so this Worker is the copy. Camilo's call
# 2026-09-18. A failed CC never fails the booking: the primary send runs first.
[vars]
BOOKING_TO = "booking@pr0social.com"
BOOKING_CC = "pr0socialprojects@gmail.com"

# Sending binding. The allowlist is the guard: even if BOOKING_TO were edited to
# something hostile, the Worker can only ever mail these two.
[[send_email]]
name = "BOOKING"
allowed_destination_addresses = [
  "booking@pr0social.com",
  "pr0socialprojects@gmail.com",
  "crivascamilo@gmail.com",
]

# Same origin as the site, so the browser needs no CORS and the form just works.
[[routes]]
pattern = "pr0social.com/api/booking"
zone_name = "pr0social.com"
